<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso — BR Costa Engenharia</title>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 40px 36px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

.logo-area { text-align: center; margin-bottom: 28px; }
.logo-area .empresa {
    font-size: 13px;
    font-weight: bold;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.logo-area h1 {
    font-size: 20px;
    font-weight: bold;
    color: #1e3a5f;
}
.logo-area p {
    font-size: 12px;
    color: #9ca3af;
    margin-top: 4px;
}

.divider {
    height: 2px;
    background: linear-gradient(90deg, #2563eb, #1e3a5f);
    border-radius: 2px;
    margin: 20px 0;
}

.field { margin-bottom: 16px; }
.field label {
    display: block;
    font-size: 11px;
    font-weight: bold;
    color: #374151;
    margin-bottom: 5px;
    text-transform: uppercase;
}
.field input {
    width: 100%;
    border: 1.5px solid #d1d5db;
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 14px;
}
.field input:focus {
    outline: none;
    border-color: #2563eb;
}

.btn-login {
    width: 100%;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 12px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}
.btn-login:hover { background: #1d4ed8; }
.btn-login:disabled { background: #93c5fd; }

.link-btn {
    background: none;
    border: none;
    color: #2563eb;
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    margin-top: 10px;
    display: block;
    width: 100%;
    text-align: center;
}

.msg {
    display: none;
    border-radius: 6px;
    padding: 10px;
    font-size: 12px;
    margin-top: 12px;
    text-align: center;
}

.msg.erro {
    background: #fef2f2;
    border: 1px solid #fca5a5;
    color: #dc2626;
}

.msg.sucesso {
    background: #f0fdf4;
    border: 1px solid #86efac;
    color: #16a34a;
}

.msg.show { display: block; }

.footer {
    text-align: center;
    font-size: 11px;
    color: #9ca3af;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="card">

<div class="logo-area">
<div class="empresa">BR Costa Engenharia</div>
<h1>Levantamento Técnico</h1>
<p>Acesso restrito</p>
</div>

<div class="divider"></div>

<div id="login-box">
<div class="field">
<label>E-mail</label>
<input type="email" id="email">
</div>

<div class="field">
<label>Senha</label>
<input type="password" id="senha">
</div>

<button class="btn-login" onclick="fazerLogin()" id="btn">Entrar</button>
<button class="link-btn" onclick="mostrarRec()">Esqueci minha senha</button>

<div id="msg-login" class="msg erro"></div>
</div>

<div id="rec-box" style="display:none;">
<div class="field">
<label>E-mail</label>
<input type="email" id="email-rec">
</div>

<button class="btn-login" onclick="recuperarSenha()">Enviar link</button>
<button class="link-btn" onclick="voltarLogin()">← Voltar</button>

<div id="msg-rec" class="msg"></div>
</div>

<div class="footer">
Somente usuários autorizados.
</div>

</div>

<!-- Netlify Identity -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

<script>
netlifyIdentity.init();

// Se já estiver logado, redireciona
netlifyIdentity.on('init', user => {
    if (user) {
        window.location.href = '/index.html';
    }
});

// Após login, redireciona
netlifyIdentity.on('login', () => {
    window.location.href = '/index.html';
});

function fazerLogin() {
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;
    const msg = document.getElementById('msg-login');
    const btn = document.getElementById('btn');

    if (!email || !senha) {
        msg.textContent = "Preencha e-mail e senha.";
        msg.classList.add('show');
        return;
    }

    btn.disabled = true;
    msg.classList.remove('show');

    netlifyIdentity.login(email, senha)
        .catch(err => {
            msg.textContent = err.message;
            msg.classList.add('show');
            btn.disabled = false;
        });
}

function recuperarSenha() {
    const email = document.getElementById('email-rec').value.trim();
    const msg = document.getElementById('msg-rec');

    if (!email) {
        msg.textContent = "Digite seu e-mail.";
        msg.className = "msg erro show";
        return;
    }

    netlifyIdentity.requestPasswordRecovery(email)
        .then(() => {
            msg.textContent = "Link enviado! Verifique seu e-mail.";
            msg.className = "msg sucesso show";
        })
        .catch(() => {
            msg.textContent = "Erro ao enviar. Verifique o e-mail.";
            msg.className = "msg erro show";
        });
}

function mostrarRec() {
    document.getElementById('login-box').style.display = 'none';
    document.getElementById('rec-box').style.display = 'block';
}

function voltarLogin() {
    document.getElementById('rec-box').style.display = 'none';
    document.getElementById('login-box').style.display = 'block';
}
</script>

</body>
</html>
