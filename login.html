<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso — BR Costa Engenharia</title>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 40px 36px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    text-align: center;
}

.empresa {
    font-size: 13px;
    font-weight: bold;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 1px;
}

h1 {
    font-size: 20px;
    font-weight: bold;
    color: #1e3a5f;
    margin: 6px 0 4px;
}

.subtitulo {
    font-size: 12px;
    color: #9ca3af;
    margin-bottom: 28px;
}

.divider {
    height: 2px;
    background: linear-gradient(90deg, #2563eb, #1e3a5f);
    border-radius: 2px;
    margin-bottom: 28px;
}

#btn-abrir-login {
    width: 100%;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 13px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
}
#btn-abrir-login:hover { background: #1d4ed8; }

.footer {
    font-size: 11px;
    color: #9ca3af;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="card">
    <div class="empresa">BR Costa Engenharia</div>
    <h1>Levantamento Técnico</h1>
    <p class="subtitulo">Acesso restrito</p>

    <div class="divider"></div>

    <button id="btn-abrir-login" onclick="netlifyIdentity.open()">
        Entrar / Criar senha
    </button>

    <p class="footer">Somente usuários autorizados.</p>
</div>

<!-- Netlify Identity Widget -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

<script>
    // Inicializa o widget
    netlifyIdentity.init();

    // Se já estiver logado, vai direto pro sistema
    netlifyIdentity.on('init', user => {
        if (user) {
            window.location.href = '/index.html';
        }
    });

    // Após login ou criação de senha, redireciona
    netlifyIdentity.on('login', () => {
        window.location.href = '/index.html';
    });

    // ✅ Se a URL tiver token de convite ou recuperação de senha,
    // abre o modal automaticamente para o usuário criar/redefinir a senha
    if (window.location.hash &&
        (window.location.hash.includes('invite_token') ||
         window.location.hash.includes('recovery_token') ||
         window.location.hash.includes('confirmation_token'))) {
        netlifyIdentity.open();
    }
</script>

</body>
</html>
